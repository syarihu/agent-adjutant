[package]
name = "adjutant"
version = "0.1.1"
edition = "2024"
description = "Agent task orchestrator: hands work out to workers, takes their reports back in"
license = "MIT"
readme = "README.md"
repository = "https://github.com/syarihu/agent-adjutant"

[lib]
name = "adjutant"
path = "src/lib.rs"

[[bin]]
name = "adjutant"
path = "src/main.rs"

[[bin]]
name = "adj"
path = "src/bin/adj.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = true
