name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check
        run: make check

  # The macOS app (app/src-tauri) is not part of the root package, so `make check` never sees it.
  # It is bundled here too: the release puts it in the macOS tarballs, and a bundle that fails there
  # stops the whole release.
  app:
    runs-on: macos-latest
    env:
      # Keep in step with release.yml.
      TAURI_CLI_VERSION: "2.12.4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/src-tauri

      - name: Format
        run: cargo fmt --check
        working-directory: app/src-tauri
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: app/src-tauri

      - name: Cache the Tauri CLI
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-tauri
          key: tauri-cli-${{ env.TAURI_CLI_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - name: Install the Tauri CLI
        run: |
          case "$(cargo tauri --version 2>/dev/null)" in
          "tauri-cli $TAURI_CLI_VERSION") ;;
          *) cargo install tauri-cli --version "=$TAURI_CLI_VERSION" --locked --force ;;
          esac
      - name: Bundle
        working-directory: app/src-tauri
        run: |
          cargo tauri build --bundles app
          codesign --verify --deep --strict target/release/bundle/macos/Adjutant.app
