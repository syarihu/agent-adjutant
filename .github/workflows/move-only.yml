name: Move-only

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: move-only-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  move-only:
    if: contains(github.event.pull_request.labels.*.name, 'move-only')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The checkout is GitHub's merge of the PR into its base, so its first parent is the base
      # it merged into and the diff is exactly what the merge brings in.
      - name: Check that the PR only moves code
        run: ./scripts/check-move-only.sh HEAD^1
